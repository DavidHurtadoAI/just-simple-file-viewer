name: Release
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - name: Verify release tag
        run: node -e "if(process.env.GITHUB_REF_NAME !== require('./manifest.json').version) throw Error('Tag and manifest version must match')"
      - name: Attest installable assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const v=process.env.GITHUB_REF_NAME; const log=fs.readFileSync('CHANGELOG.md','utf8').replace(/\r\n/g,'\n'); const notes=log.split('## '+v+'\n')[1]?.split('\n## ')[0]; if(!notes) throw Error('Missing release notes'); fs.writeFileSync('release-notes.md', 'A deliberately minimal way to read and edit text files in Obsidian. There are more comprehensive file viewers; this plugin focuses on text, using the editor already built into Obsidian.\n\n'+notes.trim()+'\n\nRequires Obsidian 1.13.0 or later. UTF-8 text only, up to 20 MiB per file.\n\nAll installable assets were built and attested in GitHub Actions.\n');"
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --verify-tag --title "Just Simple File Viewer $GITHUB_REF_NAME" --notes-file release-notes.md
      - name: Verify published assets and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir published
          for file in main.js manifest.json styles.css; do
            cmp "$file" "published/$file"
            gh attestation verify "published/$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          test "$(find published -maxdepth 1 -type f | wc -l)" -eq 3
